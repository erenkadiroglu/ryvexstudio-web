name: Dependency check

# Every Monday: lists packages with newer versions in the run summary, and fails if a known
# high or critical security issue affects a dependency, so the owner is emailed. Updates are then
# made by hand in a normal pull request; nothing here opens pull requests or writes commits.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Packages with newer versions
        run: |
          {
            echo "## Packages with newer versions"
            echo '```'
            npm outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Security audit (fails on high or critical issues)
        run: npm audit --audit-level=high
