name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # Missing reference images are written (and the run still passes); they are kept as an
      # artifact so they can be added to the repository. Existing references are compared.
      - name: Accessibility, console, link, budget and visual tests
        run: npm run test -- --update-snapshots=missing

      - name: Keep visual references and differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual
          path: |
            tests/visual.spec.ts-snapshots/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
